version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: docintel-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - docintel-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: docintel-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DATABASE=docintel
      - ENVIRONMENT=${ENVIRONMENT:-staging}
      - ALLOW_LOCAL_FALLBACK=${ALLOW_LOCAL_FALLBACK:-false}
      # Never hard-code secrets. Provide JWT_SECRET_KEY via the shell/.env at deploy time.
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set to a strong random value}
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173}
      - BOOTSTRAP_ADMIN_EMAIL=${BOOTSTRAP_ADMIN_EMAIL:-}
      - BOOTSTRAP_ADMIN_PASSWORD=${BOOTSTRAP_ADMIN_PASSWORD:-}
    volumes:
      - ./data:/app/../data
      - ./backend/uploads:/app/uploads
    depends_on:
      - mongodb
    networks:
      - docintel-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: docintel-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - docintel-net

volumes:
  mongo_data:

networks:
  docintel-net:
    driver: bridge
