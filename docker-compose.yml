version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: docintel-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - docintel-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: docintel-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DATABASE=docintel
      - JWT_SECRET=docintel-super-secret-jwt-key-production-ready-2025
      - FRONTEND_URL=http://localhost:5173
    volumes:
      - ./data:/app/../data
      - ./backend/uploads:/app/uploads
    depends_on:
      - mongodb
    networks:
      - docintel-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: docintel-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - docintel-net

volumes:
  mongo_data:

networks:
  docintel-net:
    driver: bridge
